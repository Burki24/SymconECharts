<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 600"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="aura" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#7a5af8" stop-opacity="0.22"/>
      <stop offset="58%" stop-color="#243b68" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#081326" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1a8"/>
      <stop offset="48%" stop-color="#f3c969"/>
      <stop offset="100%" stop-color="#b67a2b"/>
    </linearGradient>
    <radialGradient id="crystal" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d9fff9"/>
      <stop offset="46%" stop-color="#55d6c2"/>
      <stop offset="100%" stop-color="#266c80"/>
    </radialGradient>
  </defs>

  <!-- A translucent aura leaves the configured plate color or gradient visible. -->
  <circle cx="300" cy="300" r="286" fill="url(#aura)"/>

  <!-- Layered astrolabe rings. -->
  <circle cx="300" cy="300" r="278" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.92"/>
  <circle cx="300" cy="300" r="266" fill="none" stroke="#7a5af8" stroke-width="2" opacity="0.7"/>
  <circle cx="300" cy="300" r="249" fill="none" stroke="#f3c969" stroke-width="1.5" stroke-dasharray="2 9" opacity="0.72"/>
  <circle cx="300" cy="300" r="226" fill="none" stroke="#55d6c2" stroke-width="1.5" stroke-dasharray="15 9 2 9" opacity="0.48"/>
  <circle cx="300" cy="300" r="190" fill="none" stroke="#f3c969" stroke-width="1" opacity="0.2"/>

  <!-- Twelve celestial markers. -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <g transform="rotate(0 300 300)">
      <line x1="300" y1="22" x2="300" y2="50" stroke-width="4"/>
      <polygon points="300,58 293,70 300,82 307,70" fill="url(#crystal)" stroke-width="1.5"/>
    </g>
    <g transform="rotate(30 300 300)">
      <line x1="300" y1="22" x2="300" y2="46" stroke-width="3"/>
      <circle cx="300" cy="62" r="5" fill="#f3c969" stroke-width="1"/>
    </g>
    <g transform="rotate(60 300 300)">
      <line x1="300" y1="22" x2="300" y2="46" stroke-width="3"/>
      <circle cx="300" cy="62" r="5" fill="#f3c969" stroke-width="1"/>
    </g>
    <g transform="rotate(90 300 300)">
      <line x1="300" y1="22" x2="300" y2="50" stroke-width="4"/>
      <polygon points="300,58 293,70 300,82 307,70" fill="url(#crystal)" stroke-width="1.5"/>
    </g>
    <g transform="rotate(120 300 300)">
      <line x1="300" y1="22" x2="300" y2="46" stroke-width="3"/>
      <circle cx="300" cy="62" r="5" fill="#f3c969" stroke-width="1"/>
    </g>
    <g transform="rotate(150 300 300)">
      <line x1="300" y1="22" x2="300" y2="46" stroke-width="3"/>
      <circle cx="300" cy="62" r="5" fill="#f3c969" stroke-width="1"/>
    </g>
    <g transform="rotate(180 300 300)">
      <line x1="300" y1="22" x2="300" y2="50" stroke-width="4"/>
      <polygon points="300,58 293,70 300,82 307,70" fill="url(#crystal)" stroke-width="1.5"/>
    </g>
    <g transform="rotate(210 300 300)">
      <line x1="300" y1="22" x2="300" y2="46" stroke-width="3"/>
      <circle cx="300" cy="62" r="5" fill="#f3c969" stroke-width="1"/>
    </g>
    <g transform="rotate(240 300 300)">
      <line x1="300" y1="22" x2="300" y2="46" stroke-width="3"/>
      <circle cx="300" cy="62" r="5" fill="#f3c969" stroke-width="1"/>
    </g>
    <g transform="rotate(270 300 300)">
      <line x1="300" y1="22" x2="300" y2="50" stroke-width="4"/>
      <polygon points="300,58 293,70 300,82 307,70" fill="url(#crystal)" stroke-width="1.5"/>
    </g>
    <g transform="rotate(300 300 300)">
      <line x1="300" y1="22" x2="300" y2="46" stroke-width="3"/>
      <circle cx="300" cy="62" r="5" fill="#f3c969" stroke-width="1"/>
    </g>
    <g transform="rotate(330 300 300)">
      <line x1="300" y1="22" x2="300" y2="46" stroke-width="3"/>
      <circle cx="300" cy="62" r="5" fill="#f3c969" stroke-width="1"/>
    </g>
  </g>

  <!-- Offset orbit paths give the plate a hand-built magical-instrument look. -->
  <g transform="rotate(-18 300 300)" fill="none" stroke="#7a5af8" opacity="0.38">
    <ellipse cx="300" cy="300" rx="211" ry="116" stroke-width="2"/>
    <ellipse cx="300" cy="300" rx="211" ry="116" stroke-width="1" transform="rotate(90 300 300)"/>
    <circle cx="89" cy="300" r="7" fill="url(#crystal)" stroke="#d9fff9" stroke-width="1"/>
    <circle cx="511" cy="300" r="4" fill="#f3c969" stroke="#fff1a8" stroke-width="1"/>
  </g>

  <!-- Compass rose: deliberately subtle so gauge labels stay readable. -->
  <g opacity="0.34">
    <polygon points="300,102 318,265 300,286 282,265" fill="url(#gold)"/>
    <polygon points="498,300 335,318 314,300 335,282" fill="#55d6c2"/>
    <polygon points="300,498 282,335 300,314 318,335" fill="#7a5af8"/>
    <polygon points="102,300 265,282 286,300 265,318" fill="#55d6c2"/>
    <polygon points="160,160 278,278 274,300 252,296" fill="#f3c969"/>
    <polygon points="440,160 322,278 300,274 304,252" fill="#7a5af8"/>
    <polygon points="440,440 322,322 326,300 348,304" fill="#f3c969"/>
    <polygon points="160,440 278,322 300,326 296,348" fill="#7a5af8"/>
  </g>

  <!-- Two opposing crescent sigils. -->
  <path d="M138 206 A42 42 0 1 0 190 258 A32 32 0 1 1 138 206 Z"
        fill="url(#gold)" opacity="0.72"/>
  <path d="M462 394 A42 42 0 1 0 410 342 A32 32 0 1 1 462 394 Z"
        fill="#7a5af8" opacity="0.66"/>

  <!-- Small rune diamonds around the quiet center. -->
  <g fill="url(#crystal)" stroke="#d9fff9" stroke-width="1" opacity="0.72">
    <polygon points="300,154 308,166 300,178 292,166"/>
    <polygon points="446,300 434,308 422,300 434,292"/>
    <polygon points="300,446 292,434 300,422 308,434"/>
    <polygon points="154,300 166,292 178,300 166,308"/>
  </g>

  <circle cx="300" cy="300" r="45" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>
  <circle cx="300" cy="300" r="10" fill="url(#crystal)" opacity="0.28"/>
</svg>
