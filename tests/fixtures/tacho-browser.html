<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Gauge Multi Tacho browser fixture</title>
    <style>
        html, body { margin: 0; background: #000; color: #fff; }
        body { --symc-background: #000; --symc-text: #fff; --symc-muted: #b5b5b5;
            --symc-border: #e5e5e5; --symc-surface: #555; --symc-accent: #f0442d; }
        #echarts-gauge-chart { width: 1120px; height: 600px; }
        #echarts-gauge-error { color: #fff; }
    </style>
</head>
<body>
    <div id="echarts-gauge-chart"></div>
    <div id="echarts-gauge-error" hidden></div>
    <script>
        window.SYMC_VISUALIZATION = {
            mode: 'ipsview',
            options: { echartsThemes: { auto: {
                background: '#000', text: '#fff', muted: '#b5b5b5',
                border: '#e5e5e5', track: '#555', accent: '#f0442d'
            } } },
            state: { status: 'ready', chart: {
                theme: 'auto',
                gauge: { title: '', preset: 'tacho', style: {} },
                items: [
                    { id: 'variable-1', value: 5.2, gauge: {
                        label: 'Windgeschwindigkeit', minimum: 0, maximum: 40, unit: 'm/s', decimals: 1
                    } },
                    { id: 'variable-2', value: 18.5, gauge: {
                        label: 'Temperatur', minimum: -40, maximum: 60, unit: '°C', decimals: 1
                    } },
                    { id: 'variable-3', value: 64, gauge: {
                        label: 'Feuchte', minimum: 1, maximum: 99, unit: '%', decimals: 0
                    } }
                ]
            } }
        };
    </script>
    <script src="../../libs/echarts/6.1.0/echarts.gauge.min.js"></script>
    <script src="../../EChartsGaugeMulti/visualization/app.js"></script>
</body>
</html>
